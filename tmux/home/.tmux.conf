# COULEURS (définies en premier : utilisées par le toggle F12 et le thème)
## Couleurs
color_main="brightred"
color_dark="black"
color_light="white"
color_status_text="colour245"
color_window_off_indicator="red"
## Non utilisées pour l'instant (coloration de la barre en mode OFF retirée)
color_window_off_status_bg="white"
color_window_off_status_current_bg="brightwhite"

# GENERAL
## Petit délai pour distinguer ESC seul d'une séquence Alt+touche :
## à 0, les raccourcis M-… peuvent être mal interprétés via SSH.
set -sg escape-time 10

## Mémorise le fichier réellement chargé, pour que le rechargement
## fonctionne aussi bien avec ~/.tmux.conf qu'avec ~/.config/tmux/tmux.conf.
set -gF @conf_file "#{current_file}"

# PREFIX
## Remplace C-b par C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

## Recharger la configuration
bind r source-file -F "#{@conf_file}" \; display-message "Config reloaded: #{@conf_file}"

# TOGGLE F12 : désactive/réactive tous les raccourcis (tmux imbriqué via SSH)
## Seul l'indicateur OFF de la barre d'état signale le mode (voir THEME).
bind -T root F12 \
  set prefix None \; \
  set key-table off \; \
  if -F "#{pane_in_mode}" "send-keys -X cancel" \; \
  refresh-client -S

bind -T off F12 \
  set -u prefix \; \
  set -u key-table \; \
  refresh-client -S

# PANES
## Splits avec | et -, dans le répertoire du pane courant
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

## Navigation avec Alt+flèches, sans préfixe
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

## Zoom
bind + resize-pane -Z

## Synchronisation des panes de la fenêtre courante (bascule) : prefix S
bind S setw synchronize-panes \; display-message "Sync #{?pane_synchronized,ON,OFF}"

# WINDOWS
## Nouvelle fenêtre (Alt+Shift+T ou prefix c) puis demande de nom.
## Le prompt est attaché aux raccourcis et non à un hook global, pour ne pas
## se déclencher sur les fenêtres créées par des scripts.
## "--" et les guillemets permettent les noms avec espaces, apostrophes ou "-".
bind -n M-T new-window -c "#{pane_current_path}" \; command-prompt -I "#W" { rename-window -- "%%" }
bind c      new-window -c "#{pane_current_path}" \; command-prompt -I "#W" { rename-window -- "%%" }

## Changer de fenêtre avec Alt+Shift+flèches
bind -n M-S-Left  previous-window
bind -n M-S-Right next-window
bind -n M-S-Up    last-window
bind -n M-S-Down  last-window

## Déplacer la fenêtre courante ; -d fait suivre le focus
bind -n M-S-PageUp   swap-window -d -t :+
bind -n M-S-PageDown swap-window -d -t :-

# OPTIONS
set -g mouse on

## Bloque le renommage par séquences d'échappement (programme ou hôte distant).
## Le renommage automatique selon la commande en cours reste actif
## (automatic-rename), sauf pour les fenêtres nommées à la main.
set -g allow-rename off
## Nom automatique = commande en cours, sans le "[tmux]" affiché par défaut
## en mode copie (l'icône de mode copie de l'onglet le remplace).
setw -g automatic-rename-format "#{pane_current_command}"

set -g history-limit 100000

## Les flèches sont utilisables immédiatement après un changement de fenêtre
set -g repeat-time 0

## Numérotation à partir de 1, fenêtres et panes
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on

## Taille de fenêtre limitée par les clients qui affichent *cette* fenêtre,
## pas par tous les clients de la session.
setw -g aggressive-resize on

# NOTIFICATIONS
setw -g monitor-activity on
set  -g visual-activity off
set  -g visual-bell on
set  -g bell-action other

# COPY MODE & CLIPBOARD
## Le binding de copie était déclaré pour le mode vi : on active ce mode.
setw -g mode-keys vi

## on : tmux et les programmes des panes peuvent écrire dans le presse-papiers
## du terminal (OSC 52). Nécessaire pour qu'une copie faite dans un tmux ou un
## nvim distant (SSH) arrive dans le presse-papiers local. Contrepartie : tout
## programme d'un pane, ou contenu affiché, peut remplacer le presse-papiers
## (pastejacking) ; il ne peut pas le lire.
set -s set-clipboard on
## Interdit aux programmes de contourner tmux pour écrire au terminal
setw -g allow-passthrough off

## Outil de presse-papiers selon la session graphique (Wayland ou X11).
## Utilisé par Entrée et par la sélection à la souris.
if -b '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1' \
  'set -s copy-command "wl-copy"' \
  'set -s copy-command "xsel -i --clipboard"'
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel

# THEME
## Séparateurs powerline (Nerd Font : U+E0B2 et U+E0B0)
separator_powerline_left=""
separator_powerline_right=""

## Styles
set  -g mode-style    "fg=default,bg=$color_main"
## Depuis tmux 3.7, prompts et messages ne recouvrent toute la barre que si
## le style contient "fill" ; sans lui, la barre normale reste visible derrière.
set  -g message-style "fg=$color_main,bg=$color_dark,fill=$color_dark"
set  -g status-style  "fg=$color_status_text,bg=$color_dark"
## Pas de fond imposé : les fenêtres prennent celui de la barre (normal ou OFF)
setw -g window-status-style          "fg=$color_status_text"
## Les versions récentes de tmux soulignent la fenêtre courante par défaut
## (window-status-current-style "underscore") : le format gère déjà les couleurs.
setw -g window-status-current-style  "default"
setw -g window-status-activity-style "fg=$color_main"
setw -g pane-active-border-style     "fg=$color_main"

## Icônes (Nerd Font). Remplaçables par du texte si un glyphe ne s'affiche pas.
icon_zoom=""
icon_copy=""
icon_ssh=""
icon_root=""
icon_clock=""
color_root_alert="brightyellow"

## Marqueurs des onglets (ordre d'affichage : sync, ssh, root, copie, zoom)
### Synchronisation : badge très visible, au moins un pane synchronisé (natif)
wg_sync="#{?#{P:#{?pane_synchronized,1,}}, #[fg=$color_main#,bg=$color_light#,bold] SYNC ,}"
### Pane zoomé (natif)
wg_zoom="#{?window_zoomed_flag, $icon_zoom,}"
### Mode copie : au moins un pane de la fenêtre est en mode copie (natif)
wg_copy="#{?#{P:#{?#{==:#{pane_mode},copy-mode},1,}}, $icon_copy,}"
### SSH : au moins un pane de la fenêtre exécute ssh ou mosh (natif, immédiat)
wg_ssh="#{?#{m/r:(^| )(ssh|mosh-client) ,#{P:#{pane_current_command} }}, $icon_ssh,}"
### Root : au moins un processus root sur l'un des terminaux de la fenêtre
### (sudo, su, doas, shell root...). Passe par ps, rafraîchi à chaque
### status-interval. Chemins absolus ; les noms de tty viennent de tmux.
### Le style jaune/gras est réinitialisé juste après dans les formats d'onglet.
wg_root="#[fg=$color_root_alert,bold]#(/bin/ps -o user= -t '#{pane_tty}#{P:#,#{pane_tty}}' 2>/dev/null | /bin/grep -qx root && printf ' $icon_root')"

## Fenêtre courante
wsc_on="#[fg=$color_dark,bg=$color_main]$separator_powerline_right #I›#W$wg_sync#[fg=$color_dark,bg=$color_main,nobold]$wg_ssh$wg_root#[fg=$color_dark,nobold]$wg_copy$wg_zoom #[fg=$color_main,bg=$color_dark]$separator_powerline_right"

## Indicateur OFF : format natif, sans shell, mis à jour immédiatement
wg_is_keys_off="#{?#{==:#{client_key_table},off},#[fg=$color_light#,bg=$color_window_off_indicator] OFF #[default] ,}"

## Barre d'état
set  -g status on
set  -g status-interval 5
set  -g status-position bottom
set  -g status-justify left
set  -g status-right-length 100
set  -g status-left  " #S "
set  -g status-right "$wg_is_keys_off#H  $icon_clock %H:%M "
set  -g window-status-separator ""
setw -g window-status-format         "  #I›#W$wg_sync#[default]$wg_ssh$wg_root#[default]$wg_copy$wg_zoom  "
setw -g window-status-current-format "$wsc_on#[default]"
