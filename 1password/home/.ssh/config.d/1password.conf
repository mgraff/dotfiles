# Agent SSH de 1Password : les clés restent dans le coffre, chaque utilisation
# est approuvée dans l'application (une fois par connexion partagée, voir
# ControlMaster dans ~/.ssh/config).
#
# Lu après ~/.ssh/config.local et avant les réglages communs : un hôte peut y
# imposer un autre agent (IdentityAgent) ou une clé précise.
#
# Seulement si le socket existe, c'est-à-dire si l'application tourne avec
# « Paramètres > Développeur > Agent SSH » activé ; sinon ssh garde l'agent du
# système (SSH_AUTH_SOCK).
#
# Avec plus de 6 clés dans l'agent, certains serveurs coupent la connexion
# (« Too many authentication failures »). Dans ~/.ssh/config.local, pour cet
# hôte, désigner la clé par sa partie publique (exportée depuis 1Password) :
#     IdentityFile ~/.ssh/<clé>.pub
#     IdentitiesOnly yes

Match exec "test -S $HOME/.1password/agent.sock"
    IdentityAgent ~/.1password/agent.sock
